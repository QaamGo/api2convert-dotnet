# CI for the API2Convert .NET SDK.
# Builds, runs the offline unit suite and the independent security suite on every push/MR,
# and emits a JUnit test report (the "Tests" tab in merge requests). The live conformance
# suite runs only when API2CONVERT_API_KEY is set (protected variable). Publishing to NuGet
# runs only on a version tag.

stages:
  - test
  - publish

default:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script:
    - dotnet restore Api2Convert.sln

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# Build + offline unit suite + independent security suite, with JUnit reports.
test:
  stage: test
  script:
    - dotnet build Api2Convert.sln -c Release --no-restore
    - dotnet test test/Api2Convert.Tests -c Release --no-build --logger "junit;LogFilePath=$CI_PROJECT_DIR/junit-unit.xml"
    - dotnet test test/Api2Convert.SecurityTests -c Release --no-build --logger "junit;LogFilePath=$CI_PROJECT_DIR/junit-security.xml"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - junit-unit.xml
        - junit-security.xml

# Live conformance against the real API — runs only when API2CONVERT_API_KEY is provided
# (protected variable; the behat default key). Never committed.
live:
  stage: test
  script:
    - dotnet test test/Api2Convert.LiveTests -c Release
  rules:
    - if: '$API2CONVERT_API_KEY'
  allow_failure: true

# Publish to NuGet on a version tag. NUGET_API_KEY is a protected/masked variable.
publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - dotnet build Api2Convert.sln -c Release
    - dotnet pack src/Api2Convert/Api2Convert.csproj -c Release --no-build -o artifacts
    - dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
