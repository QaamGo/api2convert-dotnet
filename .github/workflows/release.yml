name: Release

on:
  push:
    tags: ['v*']
  # Manual run = connection test: exercises the full release flow through the OIDC login
  # (proving the nuget.org Trusted Publishing policy matches) but SKIPS the push. Never publishes.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token nuget.org exchanges for a short-lived key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore & build
        run: |
          dotnet restore Api2Convert.sln
          dotnet build Api2Convert.sln -c Release --no-restore
      # A NuGet version can never be reused, and `dotnet nuget push --skip-duplicate`
      # swallows the 409 a stale version produces — so a tag that does not match
      # <Version> would publish NOTHING and still report success. Fail closed instead.
      - name: Verify tag matches csproj version
        if: github.event_name == 'push'
        run: |
          CSPROJ_VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Api2Convert/Api2Convert.csproj | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME  csproj.Version=$CSPROJ_VERSION"
          if [ -z "$CSPROJ_VERSION" ]; then
            echo "::error::Could not read <Version> from src/Api2Convert/Api2Convert.csproj"
            exit 1
          fi
          if [ "$CSPROJ_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match csproj <Version> ($CSPROJ_VERSION)"
            exit 1
          fi
      # The guardrail runs before we ever publish an artifact.
      - name: Test (unit + security)
        run: |
          set -o pipefail
          for proj in test/Api2Convert.Tests test/Api2Convert.SecurityTests; do
            dotnet test "$proj" -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log
            # A missing or incompatible test adapter makes `dotnet test` print
            # "No test is available" and still exit 0. This is the last gate before
            # `dotnet nuget push`, so an empty run must never read as success.
            if grep -q "No test is available" test.log; then
              echo "::error::$proj discovered zero tests - refusing to publish"
              exit 1
            fi
            if ! grep -qE "^[[:space:]]*Total tests: [1-9]" test.log; then
              echo "::error::$proj reported no discovered tests - refusing to publish"
              exit 1
            fi
          done
      - name: Pack
        run: dotnet pack src/Api2Convert/Api2Convert.csproj -c Release --no-build -o artifacts
      # Trusted publishing: exchange the GitHub OIDC token for a temporary (1-hour) nuget.org
      # key. No long-lived secret is stored — the trust is a policy configured on nuget.org
      # against this repo + workflow file. Do this immediately before the push (key is short-lived).
      - name: NuGet login (OIDC → temporary key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile username (not an email)
      # Fail loudly if the policy didn't match (a failed exchange yields no key). Prints only the
      # key length — never the key itself.
      - name: Verify NuGet connection
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_KEY" ]; then
            echo "✅ Trusted Publishing OK — nuget.org issued a temporary API key (${#NUGET_KEY} chars)."
          else
            echo "::error::No temporary key returned — check the nuget.org Trusted Publishing policy (owner / repo / workflow file release.yml / empty environment)."
            exit 1
          fi
      # Publish only on a real version tag. A manual (workflow_dispatch) run stops here: the
      # connection is proven without publishing anything.
      - name: Push to NuGet
        if: github.event_name == 'push'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Connection test — publish skipped
        if: github.event_name != 'push'
        run: echo "ℹ️ Manual connection test — OIDC/trusted-publishing verified, publish intentionally skipped. Push a v* tag to publish."
