name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Api2Convert.sln
      - name: Build
        run: dotnet build Api2Convert.sln -c Release --no-restore
      # Offline unit suite + the independent security suite (real loopback servers). No API key
      # needed — the live conformance suite auto-skips unless API2CONVERT_API_KEY is set.
      - name: Unit tests
        run: dotnet test test/Api2Convert.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Security suite
        run: dotnet test test/Api2Convert.SecurityTests -c Release --no-build --logger "console;verbosity=normal"
      # The runnable examples (examples/Examples/Examples.csproj) are intentionally excluded from
      # Api2Convert.sln, so the build/test steps above never compile them. Compile-check them here —
      # against real src via <ProjectReference> — so a public-API rename can't silently break the
      # copy-paste guides. Kept out of the sln/release/Docker guardrail on purpose.
      - name: Examples compile-check
        run: dotnet build examples/Examples/Examples.csproj -c Release

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Api2Convert.sln
      # The shipped library has zero runtime PackageReferences by design; this covers the
      # test toolchain and, more importantly, catches the day that stops being true.
      # `dotnet list --vulnerable` exits non-zero on a finding on the 10.0 SDK, but older SDKs
      # returned 0 and only printed the banner. Gate on both so neither behaviour is a silent pass.
      - name: Vulnerable packages (incl. transitive)
        run: |
          set +e
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || grep -qi "has the following vulnerable packages" audit.log; then
            echo "::error::vulnerable NuGet packages found"
            exit 1
          fi

  live:
    name: Live conformance
    runs-on: ubuntu-latest
    # Only on master or a manual dispatch, and only when the key secret is present. The behat
    # default key is provided as a masked repository secret — never committed.
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Live conformance (auto-skips without the key)
        env:
          API2CONVERT_API_KEY: ${{ secrets.API2CONVERT_API_KEY }}
        run: dotnet test test/Api2Convert.LiveTests -c Release --logger "console;verbosity=normal"
